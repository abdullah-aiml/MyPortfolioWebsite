<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />

    <title>Voomly</title>

    <style>
      html {
        background-color: transparent !important;
      }

      body {
        margin: 0;
      }

      html,
      body,
      .voomly-embed {
        overflow: hidden;
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div class="voomly-embed" id="voomly-embed"></div>
  </body>

  <script src="../embed-build.js"></script>

  <script>
    function getParameterByName(name, url = window.location.href) {
      name = name.replace(/[\[\]]/g, '\\$&');
      var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)'),
        results = regex.exec(url);
      if (!results) return null;
      if (!results[2]) return '';
      return decodeURIComponent(results[2].replace(/\+/g, ' '));
    }

    attachVoomlyPlayer(
      document.getElementById('voomly-embed'),
      getParameterByName('videoId'),
      getParameterByName('type'),
      getParameterByName('videoRatio'),
      getParameterByName('presentation'),
      getParameterByName('skinColor'),
      { isNativeFullscreenFallbackEnabled: getParameterByName('isNativeFullscreen') }
    );
  </script>
</html>
